name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            use_cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            use_cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            use_cross: false
          - os: macos-latest
            target: aarch64-apple-darwin
            use_cross: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            use_cross: false
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Cross
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build Binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} --bin ample-chat
          else
            cargo build --release --target ${{ matrix.target }} --bin ample-chat
          fi
        shell: bash

      - name: Package Release Asset
        id: package
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BIN_NAME="ample-chat"
          EXT=""
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            EXT=".exe"
          fi

          BIN_PATH="target/${{ matrix.target }}/release/${BIN_NAME}${EXT}"
          ARCHIVE_DIR="ample-chat-${VERSION}-${{ matrix.target }}"
          mkdir -p "${ARCHIVE_DIR}"
          cp "${BIN_PATH}" "${ARCHIVE_DIR}/"
          cp README.md LICENSE "${ARCHIVE_DIR}/"

          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            ARCHIVE="${ARCHIVE_DIR}.zip"
            7z a "${ARCHIVE}" "${ARCHIVE_DIR}"
          else
            ARCHIVE="${ARCHIVE_DIR}.tar.gz"
            tar -czvf "${ARCHIVE}" "${ARCHIVE_DIR}"
          fi

          sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"
          echo "archive=${ARCHIVE}" >> $GITHUB_OUTPUT
          echo "checksum=${ARCHIVE}.sha256" >> $GITHUB_OUTPUT

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: ${{ steps.package.outputs.archive }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.archive }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksum }}

  publish-github-release:
    name: Create GitHub Release
    needs: [build-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false

  publish-crates-io:
    name: Publish Crates to Crates.io
    needs: [publish-github-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish ample-chat-proto
        run: cargo publish -p ample-chat-proto --token ${{ secrets.CRATES_IO_TOKEN }}

      - name: Wait for index sync
        run: sleep 30

      - name: Publish ample-chat-server
        run: cargo publish -p ample-chat-server --token ${{ secrets.CRATES_IO_TOKEN }}

      - name: Wait for index sync
        run: sleep 30

      - name: Publish ample-chat
        run: cargo publish -p ample-chat --token ${{ secrets.CRATES_IO_TOKEN }}
